<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniList Completed Anime Year Filter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1622; color: #c2d0e0; min-height: 100vh; }
  header { background: #15202b; padding: 1.5rem 2rem; text-align: center; border-bottom: 1px solid #253341; }
  header h1 { font-size: 1.5rem; color: #e1e8f0; margin-bottom: 0.25rem; }
  header p { font-size: 0.85rem; color: #8899a6; }
  .controls { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: flex-end; padding: 1.5rem 2rem; background: #192734; border-bottom: 1px solid #253341; }
  .control-group { display: flex; flex-direction: column; gap: 0.25rem; }
  .control-group label { font-size: 0.75rem; color: #8899a6; text-transform: uppercase; letter-spacing: 0.05em; }
  select, input { background: #253341; color: #c2d0e0; border: 1px solid #3a4f63; border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.9rem; }
  select:focus, input:focus { outline: none; border-color: #1da1f2; }
  button.primary { background: #1da1f2; color: #fff; border: none; border-radius: 6px; padding: 0.5rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  button.primary:hover { background: #1a8cd8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { text-align: center; padding: 1rem; font-size: 0.85rem; color: #8899a6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; padding: 1rem 0.75rem; }
    .card .info { padding: 0.4rem; }
    .card .title { font-size: 0.7rem; }
    .card .meta { font-size: 0.65rem; }
    .list { padding: 1rem 0.75rem; }
    .controls { padding: 1rem 0.75rem; gap: 0.6rem; }
  }
  .card { background: #192734; border-radius: 8px; overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; border: 1px solid #253341; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .card .info { padding: 0.75rem; }
  .card .title { font-size: 0.85rem; font-weight: 600; color: #e1e8f0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { font-size: 0.75rem; color: #8899a6; margin-top: 0.35rem; }
  .card .score { color: #f0c040; font-weight: 600; }
  .pagination { display: flex; justify-content: center; align-items: center; gap: 1rem; padding: 1.5rem; }
  .pagination button { padding: 0.4rem 1rem; background: #253341; color: #c2d0e0; border: 1px solid #3a4f63; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .pagination button:hover { background: #3a4f63; }
  .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
  .pagination span { font-size: 0.85rem; color: #8899a6; }
  .loader { display: inline-block; width: 24px; height: 24px; border: 3px solid #253341; border-top-color: #1da1f2; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #1da1f2; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .note { font-size: 0.8rem; color: #6b7d8e; text-align: center; padding: 0 2rem 0.5rem; }
  .view-toggle { display: flex; gap: 0; }
  .view-toggle button { background: #253341; color: #c2d0e0; border: 1px solid #3a4f63; padding: 0.5rem 0.9rem; font-size: 0.85rem; cursor: pointer; }
  .view-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .view-toggle button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .view-toggle button.active { background: #1da1f2; border-color: #1da1f2; color: #fff; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem 2rem; max-width: 900px; margin: 0 auto; }
  .row { display: flex; gap: 0.75rem; align-items: center; background: #192734; border: 1px solid #253341; border-radius: 8px; padding: 0.5rem 0.75rem; }
  .row:hover { border-color: #3a4f63; }
  .row img { width: 44px; height: 62px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .row .row-main { flex: 1; min-width: 0; }
  .row .row-title { font-size: 0.9rem; font-weight: 600; color: #e1e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .row-meta { font-size: 0.75rem; color: #8899a6; margin-top: 0.15rem; }
  .row .row-scores { font-size: 0.8rem; color: #8899a6; text-align: right; flex-shrink: 0; }
  .row .row-scores .score { color: #f0c040; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>AniList Completed Anime Filter</h1>
  <p>Filter your completed anime list by year range (e.g. 2024+)</p>
</header>

<div class="controls">
  <div class="control-group">
    <label>AniList Username</label>
    <input type="text" id="username" placeholder="e.g. Nade" style="width:140px">
  </div>
  <div class="control-group">
    <label>Min Year</label>
    <input type="number" id="minYear" value="2024" min="1917" max="2030" style="width:85px">
  </div>
  <div class="control-group">
    <label>Max Year</label>
    <input type="number" id="maxYear" value="" min="1917" max="2030" placeholder="none" style="width:85px">
  </div>
  <div class="control-group">
    <label>Sort By</label>
    <select id="sortBy">
      <option value="score_desc">Your Score (High &rarr; Low)</option>
      <option value="score_asc">Your Score (Low &rarr; High)</option>
      <option value="avg_desc">Avg Score (High &rarr; Low)</option>
      <option value="title">Title (A &rarr; Z)</option>
      <option value="recent">Recently Completed</option>
      <option value="year_desc">Release Year (Newest)</option>
      <option value="year_asc">Release Year (Oldest)</option>
    </select>
  </div>
  <div class="control-group">
    <label>View</label>
    <div class="view-toggle">
      <button id="galleryViewBtn" class="active" title="Gallery view">Gallery</button>
      <button id="listViewBtn" title="List view">List</button>
    </div>
  </div>
  <div class="control-group">
    <label>&nbsp;</label>
    <button class="primary" id="loadBtn">Load List</button>
  </div>
</div>

<div id="status" class="status">Enter your AniList username and click Load List</div>
<div class="note" id="note"></div>
<div id="grid" class="grid"></div>
<div id="pagination" class="pagination"></div>

<script>
const API_URL = 'https://graphql.anilist.co';

const LIST_QUERY = `query ($userName: String) {
  MediaListCollection(userName: $userName, type: ANIME, forceSingleCompletedList: true) {
    lists {
      name
      status
      entries {
        score
        repeat
        completedAt { year month day }
        media {
          id
          title { english romaji }
          coverImage { large }
          averageScore
          startDate { year }
          format
          episodes
        }
      }
    }
  }
}`;

let allListEntries = [];
let filteredList = [];
let currentPage = 1;
const perPage = 30;

// Remember username in localStorage
const usernameInput = document.getElementById('username');
const savedUser = localStorage.getItem('anilist_username');
if (savedUser) usernameInput.value = savedUser;

async function fetchMyList() {
  const username = usernameInput.value.trim();
  if (!username) throw new Error('Enter your AniList username');
  localStorage.setItem('anilist_username', username);

  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ query: LIST_QUERY, variables: { userName: username } }),
  });
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join(', '));
  if (!json.data.MediaListCollection) throw new Error('User not found or list is private');

  const entries = [];
  for (const list of json.data.MediaListCollection.lists) {
    for (const e of list.entries) {
      entries.push({
        id: e.media.id,
        title: e.media.title.english || e.media.title.romaji || 'Untitled',
        image: e.media.coverImage.large,
        userScore: e.score || 0,
        avgScore: e.media.averageScore,
        year: e.media.startDate?.year,
        format: e.media.format?.replace('_', ' ') || '',
        episodes: e.media.episodes,
        completedAt: e.completedAt,
      });
    }
  }
  return entries;
}

function filterAndSortList(entries) {
  const minYear = parseInt(document.getElementById('minYear').value) || null;
  const maxYear = parseInt(document.getElementById('maxYear').value) || null;
  const sortBy = document.getElementById('sortBy').value;

  let filtered = entries.filter(e => {
    if (minYear && (!e.year || e.year < minYear)) return false;
    if (maxYear && (!e.year || e.year > maxYear)) return false;
    return true;
  });

  filtered.sort((a, b) => {
    switch (sortBy) {
      case 'score_desc': return b.userScore - a.userScore;
      case 'score_asc': return a.userScore - b.userScore;
      case 'avg_desc': return (b.avgScore || 0) - (a.avgScore || 0);
      case 'title': return a.title.localeCompare(b.title);
      case 'recent':
        const ad = a.completedAt, bd = b.completedAt;
        if (ad?.year && bd?.year) return (bd.year * 10000 + (bd.month||0) * 100 + (bd.day||0)) - (ad.year * 10000 + (ad.month||0) * 100 + (ad.day||0));
        return 0;
      case 'year_desc': return (b.year || 0) - (a.year || 0);
      case 'year_asc': return (a.year || 0) - (b.year || 0);
      default: return 0;
    }
  });
  return filtered;
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function scoreText(m) {
  const userScoreStr = m.userScore > 0 ? `★ ${m.userScore}` : '★ -';
  const avgScoreStr = m.avgScore != null ? `[${m.avgScore}]` : '[-]';
  return { userScoreStr, avgScoreStr };
}

function renderCards(items) {
  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(m => {
    const { userScoreStr, avgScoreStr } = scoreText(m);
    const episodes = m.episodes ? `${m.episodes} ep` : '';
    const meta = [m.year, m.format, episodes].filter(Boolean).join(' · ');
    const t = esc(m.title);
    return `
      <a href="https://anilist.co/anime/${m.id}" target="_blank" rel="noopener" class="card" style="text-decoration:none;color:inherit">
        <img src="${m.image}" alt="${t}" loading="lazy">
        <div class="info">
          <div class="title" title="${t}">${t}</div>
          <div class="meta">${meta}</div>
          <div class="meta"><span class="score">${userScoreStr}</span> ${avgScoreStr}</div>
        </div>
      </a>`;
  }).join('');
}

function renderListRows(items) {
  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(m => {
    const { userScoreStr, avgScoreStr } = scoreText(m);
    const episodes = m.episodes ? `${m.episodes} ep` : '';
    const meta = [m.year, m.format, episodes].filter(Boolean).join(' · ');
    const t = esc(m.title);
    return `
      <a href="https://anilist.co/anime/${m.id}" target="_blank" rel="noopener" class="row" style="text-decoration:none;color:inherit">
        <img src="${m.image}" alt="${t}" loading="lazy">
        <div class="row-main">
          <div class="row-title" title="${t}">${t}</div>
          <div class="row-meta">${meta}</div>
        </div>
        <div class="row-scores"><span class="score">${userScoreStr}</span> ${avgScoreStr}</div>
      </a>`;
  }).join('');
}

let viewMode = localStorage.getItem('anilist_view') || 'list';

function applyViewMode() {
  const grid = document.getElementById('grid');
  grid.className = viewMode === 'list' ? 'list' : 'grid';
  document.getElementById('galleryViewBtn').classList.toggle('active', viewMode === 'gallery');
  document.getElementById('listViewBtn').classList.toggle('active', viewMode === 'list');
}

function renderResults(items) {
  if (viewMode === 'list') renderListRows(items);
  else renderCards(items);
}

function setViewMode(mode) {
  viewMode = mode;
  localStorage.setItem('anilist_view', mode);
  applyViewMode();
  if (filteredList.length) renderPage(currentPage);
}

function renderPagination(page, totalItems) {
  const el = document.getElementById('pagination');
  const totalPages = Math.ceil(totalItems / perPage);
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button id="prevBtn" ${page <= 1 ? 'disabled' : ''}>← Prev</button>
    <span>Page ${page} of ${totalPages}</span>
    <button id="nextBtn" ${page >= totalPages ? 'disabled' : ''}>Next →</button>`;
  document.getElementById('prevBtn')?.addEventListener('click', () => renderPage(page - 1));
  document.getElementById('nextBtn')?.addEventListener('click', () => renderPage(page + 1));
}

function renderPage(page) {
  currentPage = page;
  const status = document.getElementById('status');
  const start = (page - 1) * perPage;
  const slice = filteredList.slice(start, start + perPage);
  const grid = document.getElementById('grid');

  if (!slice.length) {
    grid.innerHTML = '';
    status.textContent = filteredList.length ? 'No results on this page' : 'No completed anime found matching year range';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  status.textContent = `Showing ${start + 1}–${Math.min(start + perPage, filteredList.length)} of ${filteredList.length} completed anime`;
  renderResults(slice);
  renderPagination(page, filteredList.length);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function loadList() {
  const status = document.getElementById('status');
  const grid = document.getElementById('grid');
  const pagination = document.getElementById('pagination');
  const note = document.getElementById('note');
  status.innerHTML = '<span class="loader"></span> Loading your list...';
  grid.innerHTML = '';
  pagination.innerHTML = '';
  note.textContent = '';
  try {
    allListEntries = await fetchMyList();
    applyFilter();
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}

function applyFilter() {
  filteredList = filterAndSortList(allListEntries);
  document.getElementById('note').textContent = `Loaded ${allListEntries.length} completed anime total • ${filteredList.length} matching year range`;
  renderPage(1);
}

document.getElementById('loadBtn').addEventListener('click', loadList);
document.getElementById('galleryViewBtn').addEventListener('click', () => setViewMode('gallery'));
document.getElementById('listViewBtn').addEventListener('click', () => setViewMode('list'));
applyViewMode();

['minYear', 'maxYear', 'sortBy'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (allListEntries.length) applyFilter();
  });
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter' && allListEntries.length) applyFilter();
  });
});

usernameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') loadList();
});
</script>
</body>
</html>
